<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="intlBg" x1="60" y1="20" x2="460" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071820"/>
      <stop offset="0.5" stop-color="#0e3a45"/>
      <stop offset="1" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="intlOrb" x1="170" y1="140" x2="350" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a7f3d0"/>
      <stop offset="0.5" stop-color="#6ee7c5"/>
      <stop offset="1" stop-color="#7c8cff"/>
    </linearGradient>
    <radialGradient id="intlGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 236) rotate(90) scale(160)">
      <stop stop-color="#6ee7c5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0e3a45" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#intlBg)"/>
  <circle cx="256" cy="236" r="160" fill="url(#intlGlow)"/>
  <!-- dual soft discs -->
  <circle cx="228" cy="236" r="88" fill="url(#intlOrb)" opacity="0.92"/>
  <circle cx="288" cy="248" r="78" fill="#a78bfa" opacity="0.42"/>
  <!-- lens highlight -->
  <circle cx="256" cy="240" r="36" fill="#e0fff5" opacity="0.55"/>
  <circle cx="214" cy="200" r="14" fill="#ffffff" opacity="0.5"/>
</svg>
